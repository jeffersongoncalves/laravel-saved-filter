name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        laravel: ['13']
        database: [sqlite, mysql, pgsql]
        include:
          # Lowest supported versions, SQLite only: the database matrix runs on the latest.
          - php: '8.2'
            laravel: '12'
            database: sqlite
            testbench: '^10.0'
            pest: '^3.0'
          - laravel: '13'
            testbench: '^11.0'
            pest: '^4.0'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.database }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest }}" --dev --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run tests (sqlite)
        if: matrix.database == 'sqlite'
        run: vendor/bin/pest --no-coverage

      - name: Run tests (mysql)
        if: matrix.database == 'mysql'
        env:
          SAVED_FILTER_TEST_DB_DRIVER: 'mysql'
          SAVED_FILTER_TEST_DB_HOST: '127.0.0.1'
          SAVED_FILTER_TEST_DB_PORT: '3306'
          SAVED_FILTER_TEST_DB_USERNAME: 'root'
          SAVED_FILTER_TEST_DB_PASSWORD: ''
          SAVED_FILTER_TEST_DB_DATABASE: 'testing'
        run: vendor/bin/pest --no-coverage

      - name: Run tests (pgsql)
        if: matrix.database == 'pgsql'
        env:
          SAVED_FILTER_TEST_DB_DRIVER: 'pgsql'
          SAVED_FILTER_TEST_DB_HOST: '127.0.0.1'
          SAVED_FILTER_TEST_DB_PORT: '5432'
          SAVED_FILTER_TEST_DB_USERNAME: 'postgres'
          SAVED_FILTER_TEST_DB_PASSWORD: 'postgres'
          SAVED_FILTER_TEST_DB_DATABASE: 'testing'
        run: vendor/bin/pest --no-coverage
